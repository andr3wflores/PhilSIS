events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Raster (GeoTIFF) uploads can be hundreds of MB; 100M rejected real
    # country rasters at the inspect step (HTTP 413). nginx streams the body to
    # a temp file, so a large ceiling costs disk, not memory.
    client_max_body_size 1G;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Rate-limit zones (10 MB ≈ 160 000 unique IPs).
    # login_zone: 5 req/s per IP, used on /api/auth/login (sis-api itself
    #   already locks an account after 5 failed attempts; this guards the
    #   endpoint from being hammered by a single IP across many usernames).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;

    # Hide nginx version
    server_tokens off;

    # Browser caching for versioned WMS images. The API stamps `_v=<token>`
    # on its GetMap / legend URLs, and the token changes whenever a layer's
    # pixels or styling change, so such a response never goes stale. The
    # MapServer image answers everything with `no-store`; that header is
    # replaced only when the request carries a token AND the answer is an
    # image. Errors (XML served with HTTP 200), GetFeatureInfo and requests
    # from other WMS clients keep the upstream header.
    map "$arg__v:$upstream_http_content_type" $wms_expires {
        default         off;
        "~^.+:image/"   30d;
    }

    # Server-side cache for the same versioned images, so MapServer renders
    # each map tile and legend once for all visitors (the viewer requests
    # rasters on a fixed tile grid, so everyone asks for the same URLs). It
    # lives inside the container: losing it on a recreate only costs a
    # re-render.
    proxy_cache_path /var/cache/nginx/wms levels=1:2 keys_zone=wms:5m
                     max_size=1g inactive=30d use_temp_path=off;

    # Requests that may be answered from that cache: a version token plus
    # one of the two image requests the viewer makes.
    map "$arg__v:$arg_request" $wms_cacheable {
        default                                  0;
        "~*^[^:]+:(getmap|getlegendgraphic)$"    1;
    }
    # Only image answers are stored (errors arrive as XML with HTTP 200).
    map $upstream_http_content_type $wms_not_image {
        default      1;
        "~^image/"   0;
    }

    # HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        server_name philsis.bswm.da.gov.ph;

        return 301 https://$host$request_uri;
    }

    # HTTPS Server - Production
    server {
        listen 443 ssl;
        http2 on;

        server_name philsis.bswm.da.gov.ph;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/star_bswm_da_gov_ph.key;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # Login endpoint
        location = /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            limit_req_status 429;

            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root - Web Mapping Application
        location / {
            set $upstream_web_mapping sis-web-mapping:8000;
            proxy_pass http://$upstream_web_mapping;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API
        location /api/ {
            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # API health check
        location /api/health {
            set $upstream_api sis-api:8000;
            proxy_pass http://$upstream_api/health;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Metadata - pyCSW
        location /metadata/ {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CSW
        location /csw {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Collections root
        location = /collections {
            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Collections API
        location /collections/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' '*' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;

            set $upstream_metadata sis-metadata:8000;
            proxy_pass http://$upstream_metadata$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept "application/json";
        }

        # GloSIS API
        location /glosis/ {
            set $upstream_glosis sis-api-glosis:8000;
            rewrite ^/glosis/(.*)$ /$1 break;
            proxy_pass http://$upstream_glosis;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
        }

        # MapServer - WMS/WFS
        location /mapserver {
            error_page 418 = @wms_cached;
            if ($wms_cacheable) {
                return 418;
            }

            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_set_header X-Original-URI $request_uri;
            expires $wms_expires;
        }

        # Cached WMS images
        location @wms_cached {
            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie "";

            proxy_cache wms;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 30d;
            proxy_ignore_headers Cache-Control Expires;
            proxy_no_cache $wms_not_image;
            proxy_cache_lock on;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
            add_header X-Cache-Status $upstream_cache_status always;

            expires $wms_expires;
        }

        # WMS alias
        location /wms {
            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # WFS alias
        location /wfs {
            set $upstream_mapserver sis-web-services:80;
            proxy_pass http://$upstream_mapserver$is_args$args;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Raster downloads
        location ~* ^/downloads/(?<_raster_file>[^/]+\.tiff?)$ {
            alias /srv/rasters/$_raster_file;
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment';
            add_header X-Content-Type-Options nosniff;
        }

        location /downloads/ {
            return 403;
        }

        # Landing-page media
        location ~* ^/media/(?<_site_media>[^/]+\.(png|jpe?g|webp))$ {
            alias /srv/site-media/$_site_media;
            expires 7d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options nosniff;
        }

        location /media/ {
            return 403;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}